version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: energy_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: energy_service
      POSTGRES_USER: energyuser
      POSTGRES_PASSWORD: localpass123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energyuser -d energy_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: energy_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
